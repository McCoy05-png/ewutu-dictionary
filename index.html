    function searchWord() {
      const input = document.getElementById('searchInput').value.toLowerCase().trim();
      const card = document.getElementById('resultCard');
      
      const match = dictionary.find(entry => 
        entry.english.toLowerCase() === input || entry.ewutu.toLowerCase() === input
      );
      
      if (match) {
        card.innerHTML = `
          <div class="word">${match.english} ↔ ${match.ewutu}</div>
          <div class="phonetic">Pronunciation: / ${match.pronunciation} /</div>
          <div class="def"><b>Ewutu:</b> ${match.ewutu}<br><b>English:</b> ${match.english}</div>
          <button class="audio-btn" onclick="speakText('${match.ewutu}')">🔊 Listen</button>
        `;
      } else {
        card.innerHTML = `
          <div class="word">Not Found</div>
          <div class="def">This word is not in the dictionary yet.</div>
        `;
      }
    }

    function speakText(text) {
      const utterance = new SpeechSynthesisUtterance(text);
      window.speechSynthesis.speak(utterance);
    }
